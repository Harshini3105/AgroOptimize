app = "agrooptimize-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Replace with your real Vercel URL once Step 7 gives you one, then
  # `flyctl deploy` again to pick it up (see Step 8 below).
  CORS_ALLOW_ORIGINS = "https://agrooptimize.vercel.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    port = 8000
    timeout = "10s"
    type = "http"

[mounts]
  source = "agrooptimize_results"
  destination = "/app/results"
